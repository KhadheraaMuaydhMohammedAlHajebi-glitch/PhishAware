{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="sheet sheet--narrow">
  <h1>{{ title }}</h1>
  <p class="lead">{{ message }}</p>
  <div class="actions"><a class="btn btn--primary" href="{{ url_for('consent.index') }}">Go to the start page</a></div>
  <p class="muted error-status">If you report this, mention status {{ code }}.</p>
</section>
{% endblock %}
