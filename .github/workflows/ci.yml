# Continuous integration for PhishAware (see the Unit 4 CI/CD Reflection Report).
#
# Job 1, quality gate: every push must pass linting, the unit tests with a
# statement-coverage threshold, static security analysis, and a dependency audit,
# on the oldest supported Python and on the version the container image uses.
#
# Job 2, container: the production image is built and started behind its HTTPS
# reverse proxy exactly as docs/deployment.md describes. The job checks that the
# image holds the pinned dependencies and nothing else, smoke-tests the running
# stack, and rehearses the restore procedure. A change is integrated only when
# the artifact that would be deployed has been built and exercised.
#
# Job 3, evaluation: the running stack is measured. A load test reports latency,
# throughput, and whether every score the system reports is correct; a browser
# audit reports accessibility and page-load time. docs/evaluation.md explains
# the method. The job fails when a requirement's budget is exceeded.
#
# Job 4, system and acceptance tests: the cases of docs/test-plan.md run against
# the stack as its users would use it, in three browser engines, and the upgrade
# procedure of the deployment guide is rehearsed from the previous release.
#
# Job 5, endurance: participants work at a human pace for several minutes while
# the job watches for failed requests, wrong results, slowdown, and memory growth.
name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "release/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

defaults:
  run:
    shell: bash   # bash runs with "-eo pipefail", so a failure before "| tee" still fails the step

jobs:
  quality-gate:
    name: Lint, test, and security scan (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04   # pinned: "ubuntu-latest" moves to a new release without notice
    timeout-minutes: 15     # a hung step fails the job instead of holding a runner for six hours
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt 2>&1 | tee install.log

      - name: Lint (flake8)
        run: flake8 src tests system_tests scripts evaluation run.py wsgi.py gunicorn.conf.py

      - name: Unit tests with statement coverage (pytest, coverage.py)
        run: |
          coverage run -m pytest -q 2>&1 | tee pytest.log
          coverage report --fail-under=90 | tee coverage.txt

      - name: Static security analysis (Bandit)
        run: bandit -r src wsgi.py gunicorn.conf.py -ll 2>&1 | tee bandit.txt

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements-prod.txt 2>&1 | tee audit.txt

      - name: Publish the results
        if: always()
        run: python scripts/ci_summary.py quality

      - name: Show the end of each log if a step failed
        if: failure()
        run: python scripts/ci_summary.py failure install.log pytest.log coverage.txt bandit.txt audit.txt

  container:
    name: Build the image and smoke-test the HTTPS stack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: quality-gate
    env:
      PHISHAWARE_VERSION: ci
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Write a throwaway .env with generated secrets
        run: |
          {
            echo "PHISHAWARE_ENV=production"
            echo "PHISHAWARE_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
            echo "PHISHAWARE_BACKUP_KEY=$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
            echo "PHISHAWARE_DOMAIN=localhost"
          } > .env

      - name: Fetch the base images
        run: bash scripts/ci_base_images.sh 2>&1 | tee images.log

      - name: Build the image
        run: docker compose build 2>&1 | tee build.log

      - name: Check that the image holds exactly the pinned dependencies
        run: |
          export LC_ALL=C
          docker run --rm phishaware:ci pip freeze | sort > image-freeze.txt
          grep -v '^#' constraints.txt | sed '/^$/d' | sort > pinned.txt
          diff pinned.txt image-freeze.txt | tee pins.log
          echo "The image holds the $(wc -l < pinned.txt) pinned packages and nothing else." | tee -a pins.log

      - name: Refuse to start without a secret key (fail-fast configuration)
        run: |
          if docker run --rm phishaware:ci python -c "import wsgi" > failfast.log 2>&1; then
            echo "The application started without PHISHAWARE_SECRET_KEY." | tee -a failfast.log
            exit 1
          fi
          grep -q "PHISHAWARE_SECRET_KEY must be set" failfast.log

      - name: Start the stack and wait until it is healthy
        run: |
          docker compose up --detach --wait --wait-timeout 120 2>&1 | tee up.log
          docker compose ps --format 'table {{.Service}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' \
            | tee services.log

      - name: Check that the jobs service has made its first pass
        run: |
          for attempt in $(seq 1 30); do
            docker compose logs --no-color --no-log-prefix jobs > jobs.log 2>&1 || true
            grep -q "backup(s) older than" jobs.log && break
            sleep 1
          done
          cat jobs.log
          grep -q "Deleted 0 participant record(s) older than 90 days." jobs.log
          grep -q "Encrypted backup written: /data/backups/phishaware-" jobs.log
          grep -q "Deleted 0 backup(s) older than 7 days." jobs.log

      - name: Smoke-test HTTPS through the reverse proxy
        run: |
          # Trust the proxy's local certificate authority instead of skipping verification.
          for attempt in $(seq 1 30); do
            docker compose cp proxy:/data/caddy/pki/authorities/local/root.crt caddy-root.crt \
              > /dev/null 2>&1 && break
            sleep 1
          done
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-all-errors \
            --cacert caddy-root.crt https://localhost/healthz | tee smoke.log
          grep -q '"status":"ok"' smoke.log
          # Plain HTTP is redirected, and the hardened headers arrive over HTTPS.
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost/consent)" = "308"
          curl --fail --silent --head --cacert caddy-root.crt https://localhost/consent | tee -a smoke.log
          grep -qi '^strict-transport-security: max-age=31536000' smoke.log
          grep -qi '^content-security-policy: default-src' smoke.log
          grep -i '^set-cookie: __Host-session=' smoke.log | grep -q '; Secure'
          grep -i '^set-cookie: __Host-session=' smoke.log | grep -q '; HttpOnly'

      - name: Check which TLS versions the proxy accepts
        run: |
          {
            for version in tls1_2 tls1_3; do
              openssl s_client -connect localhost:443 -servername localhost \
                -CAfile caddy-root.crt "-$version" < /dev/null 2> /dev/null \
                | grep -E "^New, |Verify return code" | sed 's/^ *//' | sort -u | paste -sd ';' - \
                | sed 's/;/; /g'
            done
            # A lowered security level lets this client offer TLS 1.1, so that a
            # refusal comes from the server and not from the client's own policy.
            if openssl s_client -connect localhost:443 -servername localhost -tls1_1 \
                -cipher 'DEFAULT:@SECLEVEL=0' < /dev/null > tls11.log 2>&1; then
              echo "TLS 1.1 was accepted"
              exit 1
            fi
            echo "TLS 1.1: refused ($(grep -oE 'alert protocol version|no protocols available|unknown option' tls11.log | head -n 1 | grep . || echo 'handshake failed'))"
          } 2>&1 | tee tls.log
          grep -q "New, TLSv1.2" tls.log
          grep -q "New, TLSv1.3" tls.log

      - name: Check the container's hardening
        run: |
          test "$(docker compose exec -T app id -u)" = "10001"   # the server is not root
          # The image holds the application only: no repository data, tests, or settings file.
          docker compose exec -T app sh -c 'ls -A /app' | paste -sd ' ' - | tee contents.log
          test "$(cat contents.log)" = "constraints.txt data gunicorn.conf.py requirements-prod.txt requirements.txt src wsgi.py"
          if docker compose exec -T app sh -c 'touch /app/probe' 2> /dev/null; then
            echo "The application code is writable at run time." | tee hardening.log
            exit 1
          fi
          docker compose exec -T app sh -c 'touch /data/probe && rm /data/probe'

      - name: Run the operational commands inside the container
        run: |
          {
            docker compose exec -T app flask create-admin --username ci-admin \
              --password "$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')"
            docker compose exec -T app flask backup-db
            docker compose exec -T app flask purge-expired --dry-run
            docker compose exec -T app flask analytics
          } 2>&1 | tee commands.log
          grep -q "Administrator 'ci-admin' created." commands.log
          grep -q "Encrypted backup written: /data/backups/phishaware-" commands.log

      - name: Rehearse the restore procedure from docs/deployment.md
        run: |
          {
            backup="$(docker compose exec -T app sh -c 'ls /data/backups/phishaware-*.db.enc | tail -n 1')"
            echo "Newest backup: $backup"
            # A change made after that backup, which the restore must undo.
            docker compose exec -T app flask create-admin --username after-backup \
              --password "$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')"
            # Ask the site for its health about five times a second, to see for how
            # long a participant would get no answer during the procedure. Each line
            # records when a request began, when it ended, and whether it was answered.
            ( while true; do
                began="$(date +%s.%N)"
                if curl --fail --silent --output /dev/null --max-time 1 \
                    --cacert caddy-root.crt https://localhost/healthz; then state=up; else state=down; fi
                echo "$began $(date +%s.%N) $state"
                sleep 0.2
              done ) > probe.log 2> /dev/null &
            probe=$!
            sleep 1
            started=$SECONDS
            docker compose stop app jobs
            echo "Services stopped after $((SECONDS - started)) s."
            docker compose run --rm --no-deps -T app flask restore-db "$backup" --yes
            echo "Backup restored after $((SECONDS - started)) s."
            docker compose up --detach --wait --wait-timeout 120
            echo "All services healthy again after $((SECONDS - started)) s."
            sleep 1
            kill "$probe"
            # A failed request can itself take up to a second, so counting failures
            # would understate the gap. The site was certainly up when the last answered
            # request before the gap began, and when the first answered request after it
            # ended; the time between those two moments is the longest the gap can be.
            awk '$3 == "down" { failed += 1; gap = 1 }
                 $3 == "up" { if (!failed) before = $1; else if (gap) { after = $2; gap = 0 } }
                 END { if (!failed) print "The site answered every health request.";
                       else if (gap) print "The site failed " failed " health request(s) and had not recovered when the probe stopped.";
                       else printf "The site failed %d health request(s); it was unavailable for at most %.1f seconds.\n", failed, after - before }' probe.log
            docker compose exec -T app python -c "import sqlite3; print('Administrator accounts after the restore:', sqlite3.connect('/data/phishaware.db').execute('SELECT COUNT(*) FROM admin_user').fetchone()[0])"
          } 2>&1 | tee restore.log
          grep -q "Database restored from /data/backups/phishaware-" restore.log
          grep -q "Administrator accounts after the restore: 1" restore.log
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-all-errors \
            --cacert caddy-root.crt https://localhost/healthz | grep -q '"status":"ok"'

      - name: Publish the deployment checks
        if: always()
        run: |
          python3 scripts/ci_summary.py notice "Running services" services.log
          python3 scripts/ci_summary.py notice "Smoke test over HTTPS" smoke.log
          python3 scripts/ci_summary.py notice "Base images" images.log
          python3 scripts/ci_summary.py notice "Pinned dependencies" pins.log
          python3 scripts/ci_summary.py notice "TLS versions" tls.log
          python3 scripts/ci_summary.py notice "Files in the image" contents.log
          python3 scripts/ci_summary.py notice "Jobs service" jobs.log
          python3 scripts/ci_summary.py notice "Operational commands" commands.log
          python3 scripts/ci_summary.py notice "Restore rehearsal" restore.log

      - name: Show the end of each log if a step failed
        if: failure()
        run: |
          docker compose ps > ps.log 2>&1 || true
          docker compose logs --no-color --tail 60 > stack.log 2>&1 || true
          python3 scripts/ci_summary.py failure images.log build.log failfast.log up.log \
            smoke.log tls.log tls11.log hardening.log ps.log stack.log

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  evaluation:
    name: Evaluate the running stack (load, accuracy, accessibility)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: container
    env:
      PHISHAWARE_VERSION: ci
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Write a throwaway .env with generated secrets
        run: |
          {
            echo "PHISHAWARE_ENV=production"
            echo "PHISHAWARE_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
            echo "PHISHAWARE_BACKUP_KEY=$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
            echo "PHISHAWARE_DOMAIN=localhost"
          } > .env
          password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')"
          echo "::add-mask::$password"
          echo "EVALUATOR_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Start the stack and create the evaluator account
        run: |
          bash scripts/ci_base_images.sh 2>&1 | tee images.log
          docker compose build 2>&1 | tee build.log
          docker compose up --detach --wait --wait-timeout 180 2>&1 | tee up.log
          for attempt in $(seq 1 30); do
            docker compose cp proxy:/data/caddy/pki/authorities/local/root.crt caddy-root.crt \
              > /dev/null 2>&1 && break
            sleep 1
          done
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-all-errors \
            --cacert caddy-root.crt --output /dev/null https://localhost/healthz
          docker compose exec -T app flask create-admin --username evaluator \
            --password "$EVALUATOR_PASSWORD"

      - name: Describe the test machine and the software under test
        run: |
          {
            echo "Runner: $(nproc) CPUs, $(awk '/MemTotal/ {printf "%.1f", $2 / 1048576}' /proc/meminfo) GB of memory, $(. /etc/os-release && echo "$PRETTY_NAME"), kernel $(uname -r)"
            echo "Docker: $(docker version --format '{{.Server.Version}}'), Compose $(docker compose version --short)"
            docker compose exec -T app python -c "import platform, sqlite3, flask, gunicorn, importlib.metadata as m; print('Image: Python', platform.python_version() + ', Flask', m.version('flask') + ', Werkzeug', m.version('werkzeug') + ', Gunicorn', gunicorn.__version__ + ', SQLite', sqlite3.sqlite_version)"
            echo "Proxy: $(docker compose exec -T proxy caddy version)"
            echo "Server: ${WEB_CONCURRENCY:-2} worker processes x ${PHISHAWARE_THREADS:-4} threads"
            echo "Database: SQLite journal mode $(docker compose exec -T app python -c "import sqlite3; print(sqlite3.connect('/data/phishaware.db').execute('PRAGMA journal_mode').fetchone()[0])") (PHISHAWARE_SQLITE_JOURNAL=AUTO)"
            echo "Services: $(docker compose ps --format '{{.Service}} ({{.State}})' | paste -sd ' ' -)"
            echo "Image size: $(docker image inspect phishaware:ci --format '{{.Size}}' | awk '{printf "%.1f MB", $1 / 1000000}')"
          } | tee machine.txt

      - name: Load test - latency, throughput, and result accuracy
        run: |
          python3 evaluation/loadtest.py --base-url https://localhost --cacert caddy-root.crt \
            --levels 1,5,10,25,50,100,200 --min-journeys 25 \
            --admin-user evaluator --admin-password "$EVALUATOR_PASSWORD" \
            --markdown "$GITHUB_STEP_SUMMARY" | tee loadtest.log

      - name: Memory footprint after the load test
        if: always()
        run: |
          {
            for service in app jobs proxy; do
              peak="$(docker compose exec -T "$service" cat /sys/fs/cgroup/memory.peak 2> /dev/null || true)"
              now="$(docker compose exec -T "$service" cat /sys/fs/cgroup/memory.current 2> /dev/null || true)"
              echo "$service container: peak ${peak:-unknown} bytes, now ${now:-unknown} bytes"
            done
            docker stats --no-stream --format '{{.Name}}: {{.MemUsage}}, {{.PIDs}} processes'
            docker compose exec -T app sh -c 'ls -l /data/phishaware.db* | awk "{print \$5, \$9}"'
          } 2>&1 | tee memory.txt

      - name: Set up Python for the browser audit
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Installing the audit's tools was one step, and it stalled in two runs until
      # the run was cancelled by hand. It is now two steps, so that a stall shows
      # which part is responsible, and each has its own time limit.
      - name: Install Playwright, axe-core, and the browsers' system packages
        timeout-minutes: 8
        run: |
          pip install -r evaluation/requirements.txt
          npm install --no-save --prefix "$RUNNER_TEMP/axe" axe-core@4.10.2
          python -m playwright install-deps chromium firefox webkit

      - name: Download the browsers
        timeout-minutes: 12
        run: |
          # A download can be repeated safely: a browser that is already complete
          # is skipped. An attempt that has not finished after three minutes is
          # stopped and started again, at most three times.
          for attempt in 1 2 3; do
            if timeout --kill-after=10 180 python -m playwright install chromium firefox webkit; then
              exit 0
            fi
            echo "::warning title=Browser download::Attempt $attempt did not finish."
          done
          echo "::error title=Browser download::The browsers could not be downloaded in three attempts."
          exit 1

      - name: Browser audit - accessibility, layout, and page load
        run: |
          python evaluation/browser_audit.py --base-url https://localhost --ignore-https-errors \
            --axe "$RUNNER_TEMP/axe/node_modules/axe-core/axe.min.js" --also firefox,webkit \
            --admin-user evaluator --admin-password "$EVALUATOR_PASSWORD" \
            --markdown "$GITHUB_STEP_SUMMARY" | tee audit.log

      - name: Load test with write-ahead logging, for comparison
        run: |
          # The same test against a fresh database in the other journal mode. It
          # measures what the cautious default costs (see docs/evaluation.md).
          docker compose down --volumes > /dev/null 2>&1
          echo "PHISHAWARE_SQLITE_JOURNAL=WAL" >> .env
          docker compose up --detach --wait --wait-timeout 180 2>&1 | tee up-wal.log
          for attempt in $(seq 1 30); do
            docker compose cp proxy:/data/caddy/pki/authorities/local/root.crt caddy-root.crt \
              > /dev/null 2>&1 && break
            sleep 1
          done
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-all-errors \
            --cacert caddy-root.crt --output /dev/null https://localhost/healthz
          docker compose exec -T app flask create-admin --username evaluator \
            --password "$EVALUATOR_PASSWORD"
          {
            echo "Journal mode: $(docker compose exec -T app python -c "import sqlite3; print(sqlite3.connect('/data/phishaware.db').execute('PRAGMA journal_mode').fetchone()[0])") (PHISHAWARE_SQLITE_JOURNAL=WAL)"
            python3 evaluation/loadtest.py --base-url https://localhost --cacert caddy-root.crt \
              --levels 1,5,10,25,50,100,200 --min-journeys 25 \
              --admin-user evaluator --admin-password "$EVALUATOR_PASSWORD"
          } | tee loadtest-wal.log

      - name: Publish the measurements
        if: always()
        run: |
          python3 scripts/ci_summary.py notice "Test machine" machine.txt
          python3 scripts/ci_summary.py notice "Load test" loadtest.log
          python3 scripts/ci_summary.py notice "Memory" memory.txt
          python3 scripts/ci_summary.py notice "Browser audit" audit.log
          python3 scripts/ci_summary.py notice "Load test, write-ahead logging" loadtest-wal.log

      - name: Show the end of the stack's log if a step failed
        if: failure()
        run: |
          docker compose logs --no-color --tail 60 > stack.log 2>&1 || true
          python3 scripts/ci_summary.py failure images.log build.log up.log up-wal.log stack.log

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  system-test:
    name: System and acceptance tests on the running stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: container
    env:
      PHISHAWARE_VERSION: ci
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Write a throwaway .env with generated secrets
        run: |
          {
            echo "PHISHAWARE_ENV=production"
            echo "PHISHAWARE_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
            echo "PHISHAWARE_BACKUP_KEY=$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
            echo "PHISHAWARE_DOMAIN=localhost"
            # Case AT-13 checks that this line reaches every page.
            echo "PHISHAWARE_CONTACT=A. Researcher, researcher@northbridge.example"
          } > .env
          password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')"
          echo "::add-mask::$password"
          echo "EVALUATOR_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Start the stack and create the evaluator account
        run: |
          bash scripts/ci_base_images.sh 2>&1 | tee images.log
          docker compose build 2>&1 | tee build.log
          docker compose up --detach --wait --wait-timeout 180 2>&1 | tee up.log
          for attempt in $(seq 1 30); do
            docker compose cp proxy:/data/caddy/pki/authorities/local/root.crt caddy-root.crt \
              > /dev/null 2>&1 && break
            sleep 1
          done
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-all-errors \
            --cacert caddy-root.crt --output /dev/null https://localhost/healthz
          docker compose exec -T app flask create-admin --username evaluator \
            --password "$EVALUATOR_PASSWORD"

      - name: Set up Python for the browser tests
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Playwright and the browsers' system packages
        timeout-minutes: 8
        run: |
          pip install -r evaluation/requirements.txt
          python -m playwright install-deps chromium firefox webkit

      - name: Download the browsers
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            if timeout --kill-after=10 180 python -m playwright install chromium firefox webkit; then
              exit 0
            fi
            echo "::warning title=Browser download::Attempt $attempt did not finish."
          done
          echo "::error title=Browser download::The browsers could not be downloaded in three attempts."
          exit 1

      # The acceptance cases run first, on the empty database, so that case AT-11
      # can observe the reporting threshold before five participants exist.
      - name: Acceptance and system cases in Chromium
        run: |
          python -m system_tests.run --level acceptance,system --strict \
            --base-url https://localhost --cacert caddy-root.crt --ignore-https-errors \
            --admin-user evaluator --admin-password "$EVALUATOR_PASSWORD" \
            --cli "docker compose exec -T app flask" \
            --crash-command "sh system_tests/crash_web_service.sh" \
            --screenshots evidence/screenshots --json evidence/chromium.json \
            --markdown "$GITHUB_STEP_SUMMARY" 2> chromium.err | tee system-chromium.log

      - name: Acceptance cases in Firefox
        if: always()
        run: |
          python -m system_tests.run --level acceptance --strict --browser firefox \
            --base-url https://localhost --cacert caddy-root.crt --ignore-https-errors \
            --admin-user evaluator --admin-password "$EVALUATOR_PASSWORD" \
            --cli "docker compose exec -T app flask" \
            --screenshots evidence/screenshots --json evidence/firefox.json \
            --markdown "$GITHUB_STEP_SUMMARY" 2> firefox.err | tee acceptance-firefox.log

      - name: Acceptance cases in WebKit
        if: always()
        run: |
          python -m system_tests.run --level acceptance --strict --browser webkit \
            --base-url https://localhost --cacert caddy-root.crt --ignore-https-errors \
            --admin-user evaluator --admin-password "$EVALUATOR_PASSWORD" \
            --cli "docker compose exec -T app flask" \
            --screenshots evidence/screenshots --json evidence/webkit.json \
            --markdown "$GITHUB_STEP_SUMMARY" 2> webkit.err | tee acceptance-webkit.log

      # Last, because it replaces the stack's data: docs/deployment.md, section 8.
      - name: Rehearse the upgrade from the previous release, and the rollback
        if: always()
        run: bash system_tests/upgrade_rehearsal.sh 2>&1 | tee upgrade.log

      - name: Publish the test reports
        if: always()
        run: |
          python3 scripts/ci_summary.py notice "System and acceptance cases, Chromium" system-chromium.log
          python3 scripts/ci_summary.py notice "Acceptance cases, Firefox" acceptance-firefox.log
          python3 scripts/ci_summary.py notice "Acceptance cases, WebKit" acceptance-webkit.log
          python3 scripts/ci_summary.py notice "Upgrade and rollback rehearsal" upgrade.log

      # Screenshots of the screens the cases looked at, one of every open tab when a
      # case fails, and the full result of each run as JSON.
      - name: Keep the evidence with the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: system-test-evidence
          path: |
            evidence/
            system-chromium.log
            acceptance-firefox.log
            acceptance-webkit.log
            upgrade.log
          if-no-files-found: ignore
          retention-days: 90

      - name: Show the end of each log if a step failed
        if: failure()
        run: |
          docker compose ps > ps.log 2>&1 || true
          docker compose logs --no-color --tail 60 > stack.log 2>&1 || true
          python3 scripts/ci_summary.py failure images.log build.log up.log chromium.err \
            firefox.err webkit.err upgrade.log ps.log stack.log

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  endurance:
    name: Endurance test (stability over time)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: container
    env:
      PHISHAWARE_VERSION: ci
      # Ten minutes for a release, three for every other push. For now also ten on
      # the branch that examines the memory check, to see the whole curve (test fault T-3).
      SOAK_MINUTES: ${{ (startsWith(github.ref_name, 'release/') || github.ref_name == 'main' || github.ref_name == 'fix/endurance-memory-measure') && '10' || '3' }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Write a throwaway .env with generated secrets
        run: |
          {
            echo "PHISHAWARE_ENV=production"
            echo "PHISHAWARE_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
            echo "PHISHAWARE_BACKUP_KEY=$(python3 -c 'import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())')"
            echo "PHISHAWARE_DOMAIN=localhost"
          } > .env
          password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')"
          echo "::add-mask::$password"
          echo "EVALUATOR_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Start the stack and create the evaluator account
        run: |
          bash scripts/ci_base_images.sh 2>&1 | tee images.log
          docker compose build 2>&1 | tee build.log
          docker compose up --detach --wait --wait-timeout 180 2>&1 | tee up.log
          for attempt in $(seq 1 30); do
            docker compose cp proxy:/data/caddy/pki/authorities/local/root.crt caddy-root.crt \
              > /dev/null 2>&1 && break
            sleep 1
          done
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-all-errors \
            --cacert caddy-root.crt --output /dev/null https://localhost/healthz
          docker compose exec -T app flask create-admin --username evaluator \
            --password "$EVALUATOR_PASSWORD"

      - name: Endurance test - 25 participants at a human pace
        run: |
          python3 evaluation/soaktest.py --base-url https://localhost --cacert caddy-root.crt \
            --users 25 --minutes "$SOAK_MINUTES" --think-time 1 \
            --admin-user evaluator --admin-password "$EVALUATOR_PASSWORD" \
            --memory-command "docker compose exec -T app cat /sys/fs/cgroup/memory.stat" \
            --markdown "$GITHUB_STEP_SUMMARY" | tee soak.log

      - name: State of the stack after the test
        if: always()
        run: |
          {
            docker compose ps --format 'table {{.Service}}\t{{.Status}}'
            docker compose exec -T app sh -c 'ls -l /data/phishaware.db* | awk "{print \$5, \$9}"'
            docker compose exec -T jobs flask jobs-status
            # What the web service's memory consists of. The test judges "anon", the
            # memory of the processes; "file" and "slab" are caches of the kernel.
            echo "Memory of the web service, in bytes: total $(docker compose exec -T app cat /sys/fs/cgroup/memory.current)"
            docker compose exec -T app grep -E '^(anon|file|slab|sock) ' /sys/fs/cgroup/memory.stat
            # And which process holds it: the server's first process, or its two workers.
            docker compose exec -T app python - < scripts/process_memory.py
          } 2>&1 | tee after.log

      - name: Publish the measurements
        if: always()
        run: |
          python3 scripts/ci_summary.py notice "Endurance test" soak.log
          python3 scripts/ci_summary.py notice "Stack after the endurance test" after.log

      - name: Show the end of the stack's log if a step failed
        if: failure()
        run: |
          docker compose logs --no-color --tail 60 > stack.log 2>&1 || true
          python3 scripts/ci_summary.py failure images.log build.log up.log stack.log

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
